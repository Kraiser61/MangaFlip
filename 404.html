<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | MangaFlip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --accent: #00f2fe;
            --accent-pink: #ff007f;
            --text-primary: #f1f1f5;
            --text-secondary: #8e8e9f;
            --font-main: 'Outfit', sans-serif;
            --border-radius: 16px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* Glow elements */
        .glow-bg {
            position: absolute;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            filter: blur(150px);
            z-index: 1;
            opacity: 0.15;
            pointer-events: none;
        }
        .glow-1 {
            top: -10vw;
            left: -10vw;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
        }
        .glow-2 {
            bottom: -10vw;
            right: -10vw;
            background: radial-gradient(circle, var(--accent-pink) 0%, transparent 70%);
        }
        /* Card Container */
        .card {
            background: rgba(18, 18, 22, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 48px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .icon-container {
            font-size: 4rem;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            animation: float 4s ease-in-out infinite;
        }
        h1 {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--accent) 0%, rgba(0, 242, 254, 0.7) 100%);
            color: #0a0a0c;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>
    <div class="card">
        <div class="icon-container">
            <i class="fa-solid fa-book-open-reader"></i>
        </div>
        <h1>404</h1>
        <h2>Lost in the Spirit World?</h2>
        <p>The page you are looking for doesn't exist, has been moved, or lies hidden deep inside the Spirit World.</p>
        <a href="index.html" class="btn">
            <i class="fa-solid fa-house"></i> Return to Library
        </a>
    </div>
</body>
</html>
